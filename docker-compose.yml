services:
  db:
    image: postgres:16
    container_name: pause-db
    environment:
      POSTGRES_USER: pause
      POSTGRES_PASSWORD: pause
      POSTGRES_DB: pause
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pause-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pause -d pause"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pause-db-data:
